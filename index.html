<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Inventory Mini Form</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>

  <h2>Inventory Test Form</h2>

  <form id="inventoryForm">
    <label>
      Date:
      <input type="date" name="date" required>
    </label>
    <br><br>

    <label>
      IN / OUT:
      <select name="type" required>
        <option value="">Select</option>
        <option value="IN">IN</option>
        <option value="OUT">OUT</option>
      </select>
    </label>
    <br><br>

    <label>
      Client:
      <input type="text" name="client" required>
    </label>
    <br><br>

    <label>
      Amount:
      <input type="number" name="amount" min="1" required>
    </label>
    <br><br>

    <label>
      Item:
      <input type="text" name="item" required>
    </label>
    <br><br>

    <button type="submit">Submit</button>
  </form>

  <p id="status"></p>

  <!-- SCRIPT SEMPRE NO FINAL DO BODY -->
  <script>
    console.log('Script loaded');

    const form = document.getElementById('inventoryForm');
    const statusEl = document.getElementById('status');

    if (!form) {
      console.error('Form not found');
    }

    form.addEventListener('submit', async function (e) {
      e.preventDefault();

      statusEl.textContent = 'Sending...';

      const formData = new FormData(form);
      const payload = Object.fromEntries(formData.entries());

      try {
        const response = await fetch('https://script.google.com/macros/s/AKfycbyBeYxoumQMDvgcJZ9dlBlPREkirmJMGdkiN7Fk6joMULioiCcwagmSHmjgkm84FfJErg/exec', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify(payload)
        });

        const result = await response.json();

        if (result.success) {
          statusEl.textContent = 'Submitted successfully';
          form.reset();
        } else {
          statusEl.textContent = 'Backend error';
          console.error(result);
        }

      } catch (err) {
        statusEl.textContent = 'Request failed';
        console.error(err);
      }
    });
  </script>

</body>
</html>
