<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <title>Inventory Form</title>
</head>
<body>

<input type="email" id="userEmail" placeholder="Seu email" required>

<form id="itemForm">
  <input type="date" id="date" required>

  <select id="type" required>
    <option value="">Selecione</option>
    <option value="IN">IN</option>
    <option value="OUT">OUT</option>
  </select>

  <input type="text" id="client" placeholder="Cliente" required>
  <input type="number" id="amount" placeholder="Quantidade" required>
  <input type="text" id="item" placeholder="Item" required>

  <textarea id="description" placeholder="Descrição (opcional)"></textarea>

  <button type="submit">Adicionar item</button>
</form>

<ul id="itemsList"></ul>

<button id="submitAll">Enviar tudo</button>

<div id="status"></div>

<script src="inventory.js?v=20260120"></script>

</body>
</html>
